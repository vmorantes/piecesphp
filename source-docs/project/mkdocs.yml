site_name: Documentación de desarrollo
theme:
    name: material
    language: es
    palette:
        # Palette toggle for light/dark mode
        - media: "(prefers-color-scheme: light)"
          scheme: default
          primary: black
          accent: red
          toggle:
              icon: material/brightness-7
              name: Cambiar a modo oscuro
        - media: "(prefers-color-scheme: dark)"
          scheme: slate
          primary: black
          accent: red
          toggle:
              icon: material/brightness-4
              name: Cambiar a modo claro
    features:
        - navigation.tabs
        - navigation.sections
        - navigation.expand
        - navigation.top
        - navigation.tracking
        - navigation.indexes
        - content.code.copy
        - content.code.annotate
        - search.suggest
        - search.highlight
        - search.share

nav:
    - Home: index.md
    - PiecesPHP Framework: 
        - piecesphp/index.md
        - Despliegue: piecesphp/content/general.md
        - Permisos: piecesphp/content/permissions.md
        - Estructura: piecesphp/content/structure.md
        - Los archivos de configuración: piecesphp/content/configuration.md
        - Idiomas y traducciones: piecesphp/content/idiomas.md
        - El arranque de una petición: piecesphp/content/arranque.md
        - La sesión del panel: piecesphp/content/sesion.md
        - Las imágenes de Configuración: piecesphp/content/imagenes-de-configuracion.md
        - El correo saliente: piecesphp/content/correo.md
        - Las notificaciones: piecesphp/content/notificaciones.md
        - El centro de mando de la IA: piecesphp/content/ia.md
        - Rutas: piecesphp/content/routing.md
        - Mappers: piecesphp/content/mappers.md
        - Gulp: piecesphp/content/gulp.md
        - Terminal: piecesphp/content/terminal.md
        - Crear un módulo: piecesphp/content/modules.md
        - El panel por dentro: piecesphp/content/panel.md
        - Mantener el framework: piecesphp/content/maintain.md
        - Características Avanzadas:
            - Avisos del sistema y mantenimiento: piecesphp/new-features/system-status.md
            - Salud de la instalación: piecesphp/new-features/system-health.md
            - Un MCP para desarrollar: piecesphp/new-features/mcp-para-desarrollar.md
            - Registros: piecesphp/new-features/registros.md
            - El geovisor: piecesphp/new-features/geovisor.md
            - Errores y excepciones: piecesphp/new-features/errores-y-excepciones.md
            - La clave de la aplicación: piecesphp/new-features/clave-de-la-aplicacion.md
            - Modo mantenimiento: piecesphp/new-features/maintenance-mode.md
            - Identidad, SEO y scripts: piecesphp/new-features/seo-y-scripts.md
            - Sistema de Colas: piecesphp/new-features/queues.md
            - FreezeRequest: piecesphp/new-features/freeze-request.md
            - HttpClient: piecesphp/new-features/http-client.md
            - Eventos: piecesphp/new-features/events.md
            - CronJobs: piecesphp/new-features/cronjobs.md
            - Pruebas Unitarias (CLI): piecesphp/new-features/unit-testing.md
            - Archivos Protegidos: piecesphp/new-features/protected-files.md
            - Gestor de archivos: piecesphp/new-features/gestor-de-archivos.md
            - Exportador BBDD Nativo: piecesphp/new-features/database-exporter.md
            - Respaldos de la base de datos: piecesphp/new-features/backups.md
            - Registro de sesiones caducadas: piecesphp/new-features/expired-sessions-log.md
            - Escapado y nombres de subidas: piecesphp/new-features/escapado-y-subidas.md
            - Permisos de ruta: piecesphp/new-features/permisos-de-ruta.md
            - Campos que no salen nunca: piecesphp/new-features/campos-ocultos.md
            - Preguntar al usuario: piecesphp/new-features/preguntar.md
            - Pantallas de contenido: piecesphp/new-features/pantallas-de-contenido.md
            - Categorías genéricas: piecesphp/new-features/categorias-genericas.md
            - Componentes HTML por grupo: piecesphp/new-features/componentes.md
            - Gráficos y estadísticas: piecesphp/new-features/estadisticas.md
            - El manual de usuario del panel: piecesphp/new-features/manual-de-usuario.md
            - El banco de pruebas de correo: piecesphp/new-features/banco-de-correos.md
            - Datos de prueba: piecesphp/new-features/datos-de-prueba.md
            - Importar y exportar datos:
                - piecesphp/new-features/data-transfer.md
                - Usar el panel: piecesphp/new-features/data-transfer/panel.md
                - Crear un importador: piecesphp/new-features/data-transfer/importador.md
                - Crear un exportador o un informe: piecesphp/new-features/data-transfer/exportador.md
                - Referencia: piecesphp/new-features/data-transfer/referencia.md
                - Migrar desde BaseExportData: piecesphp/new-features/data-transfer/migrar-desde-baseexportdata.md
    - Changelog: changelog.md

site_dir: ../../docs

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      # Rutas relativas a la raíz del repositorio; un fragmento que falta rompe el build.
      base_path: ['../..']
      check_paths: true
